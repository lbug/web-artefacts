# Publishes to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub, and the
# package gets a provenance attestation automatically. This workflow never
# pushes commits, so the repository keeps a single human contributor.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip if this version is already on npm
        id: check
        run: |
          if npm view "web-artefacts@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version already on npm – nothing to publish."
          fi
      - run: npm ci
        if: steps.check.outputs.published != 'true'
      - run: npm run typecheck
        if: steps.check.outputs.published != 'true'
      - run: npm test
        if: steps.check.outputs.published != 'true'
      - run: npm publish --access public
        if: steps.check.outputs.published != 'true'
