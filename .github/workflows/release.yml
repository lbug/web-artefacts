# Stages a release on npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub, and the
# package gets a provenance attestation automatically. The trusted publisher
# may only stage, so a maintainer approves each version with 2FA on
# npmjs.com (or `npm stage approve <id>`) before it goes live. It then creates the
# GitHub release with the version's section of CHANGELOG.md. This workflow never
# pushes commits, so the repository keeps a single human contributor.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the GitHub release
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15.0.
      - run: npm install -g npm@latest
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: node changelog.mjs notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - name: Skip if this version is already on npm
        id: check
        run: |
          if npm view "web-artefacts@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version already on npm – nothing to publish."
          fi
      - run: npm ci
        if: steps.check.outputs.published != 'true'
      - run: npm run typecheck
        if: steps.check.outputs.published != 'true'
      - run: npm test
        if: steps.check.outputs.published != 'true'
      - run: npm stage publish
        if: steps.check.outputs.published != 'true'
      # Also runs when the version was already on npm, so a re-run adds a missing release.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
